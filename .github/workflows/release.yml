name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip bauen
        run: |
          mkdir -p vlip-health && cp vlip-health.php vlip-health/ && zip -r vlip-health.zip vlip-health
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: vlip-health.zip
          generate_release_notes: true
